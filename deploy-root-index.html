<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正在进入 未完之章</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="./Blog/">
<!-- 如果你的博客目录不叫 Blog，把下面两处 ./Blog/ 一起改掉 -->
<meta http-equiv="refresh" content="0; url=./Blog/">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    align-content: center;
    gap: 1.4rem;
    background:
      radial-gradient(46% 42% at 50% 47%, rgba(255, 176, 87, 0.12), transparent 72%),
      #07080a;
    color: #e9ecf1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    text-align: center;
  }
  .mark { width: 46px; height: 46px; opacity: 0.55; }
  .mark .ring {
    fill: none;
    stroke: rgba(255, 255, 255, 0.3);
    stroke-width: 0.75;
  }
  .mark .iris {
    fill: none;
    stroke: rgba(255, 255, 255, 0.15);
    stroke-width: 0.75;
    transform-box: view-box;
    transform-origin: 100px 100px;
    animation: turn 48s linear infinite;
  }
  .mark .core { fill: #ffb057; }
  @keyframes turn { to { transform: rotate(360deg); } }
  p { margin: 0; font-size: 0.95rem; letter-spacing: 0.06em; }
  b { font-weight: 600; }
  a {
    color: #a6aebc;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 0.74rem;
    letter-spacing: 0.1em;
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 176, 87, 0.35);
  }
  a:hover { color: #e9ecf1; }
  @media (prefers-reduced-motion: reduce) {
    .mark .iris { animation: none; }
  }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 200 200" aria-hidden="true">
    <circle class="ring" cx="100" cy="100" r="72"/>
    <g class="iris">
      <path d="M100 100 L172 100 A72 72 0 0 1 136 162.35 Z"/>
      <path d="M100 100 L136 162.35 A72 72 0 0 1 64 162.35 Z"/>
      <path d="M100 100 L64 162.35 A72 72 0 0 1 28 100 Z"/>
      <path d="M100 100 L28 100 A72 72 0 0 1 64 37.65 Z"/>
      <path d="M100 100 L64 37.65 A72 72 0 0 1 136 37.65 Z"/>
      <path d="M100 100 L136 37.65 A72 72 0 0 1 172 100 Z"/>
    </g>
    <circle class="core" cx="100" cy="100" r="6"/>
  </svg>

  <p>正在进入 <b>未完之章</b>……</p>
  <p><a href="./Blog/">没有自动跳转？点这里</a></p>

  <script>
    /* 用 replace 而不是 href：访问记录里只留一条，返回时不会来回弹 */
    location.replace("./Blog/");
  </script>
</body>
</html>
