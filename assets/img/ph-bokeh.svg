<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="大光圈下的焦外光斑">
  <title>焦外</title>
  <defs>
    <linearGradient id="bokehBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset=".5" stop-color="#151119"/>
      <stop offset="1" stop-color="#080a10"/>
    </linearGradient>
    <radialGradient id="warmOrb" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffcf87" stop-opacity=".95"/>
      <stop offset=".62" stop-color="#ff9f45" stop-opacity=".42"/>
      <stop offset=".9" stop-color="#ff8a2e" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ff8a2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coolOrb" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#cfeaff" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#63b8ff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#3f9dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetOrb" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e5d9ff" stop-opacity=".85"/>
      <stop offset=".62" stop-color="#8f7dff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#8f7dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="bokehBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bokehBg)"/>

  <!-- 背景一层大光斑 -->
  <g filter="url(#bokehBlur)" opacity=".8">
    <circle cx="250" cy="230" r="130" fill="url(#warmOrb)"/>
    <circle cx="640" cy="180" r="96" fill="url(#coolOrb)"/>
    <circle cx="980" cy="280" r="150" fill="url(#warmOrb)"/>
    <circle cx="440" cy="620" r="120" fill="url(#violetOrb)"/>
    <circle cx="860" cy="660" r="140" fill="url(#coolOrb)"/>
    <circle cx="1120" cy="560" r="90" fill="url(#warmOrb)"/>
  </g>

  <!-- 中景光斑：边缘略有收缩，模拟球差 -->
  <g opacity=".85">
    <circle cx="180" cy="560" r="66" fill="url(#warmOrb)"/>
    <circle cx="380" cy="330" r="52" fill="url(#coolOrb)"/>
    <circle cx="560" cy="470" r="74" fill="url(#warmOrb)"/>
    <circle cx="760" cy="330" r="44" fill="url(#violetOrb)"/>
    <circle cx="1030" cy="640" r="58" fill="url(#coolOrb)"/>
    <circle cx="120" cy="130" r="40" fill="url(#warmOrb)"/>
  </g>

  <!-- 前景实焦：一小段金属反光，给画面一个落点 -->
  <g>
    <rect x="470" y="700" width="290" height="10" rx="5" fill="#f6e2c2" opacity=".82"/>
    <rect x="470" y="716" width="290" height="4" rx="2" fill="#9fd2ff" opacity=".45"/>
    <rect x="470" y="724" width="180" height="3" rx="1.5" fill="#ffffff" opacity=".2"/>
  </g>
  <circle cx="620" cy="792" r="86" fill="#ffb057" opacity=".07"/>
</svg>
