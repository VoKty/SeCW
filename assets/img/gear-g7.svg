<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Panasonic G7 微单机身示意图">
  <title>Panasonic Lumix G7 · 示意图</title>
  <defs>
    <linearGradient id="g7Body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b95a6" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#5d6675" stop-opacity=".08"/>
      <stop offset="1" stop-color="#2b3140" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="g7Glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc7ff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ffb057" stop-opacity=".18"/>
    </linearGradient>
  </defs>

  <g stroke="#8b95a6" fill="none" stroke-width="2.5" stroke-linejoin="round">
    <!-- 更小的机身：M4/3 的关键优势 -->
    <path d="M286 340 h384 a22 22 0 0 1 22 22 v176 a22 22 0 0 1 -22 22 h-384 a22 22 0 0 1 -22 -22 v-176 a22 22 0 0 1 22 -22 z" fill="url(#g7Body)"/>
    <path d="M420 340 l24 -52 h132 l24 52 z" fill="url(#g7Body)"/>
    <!-- 翻转屏 -->
    <path d="M300 560 h356 l-18 62 h-320 z" fill="url(#g7Body)"/>
    <!-- 电子取景器 -->
    <rect x="470" y="248" width="92" height="40" rx="8" fill="url(#g7Body)"/>
    <rect x="478" y="258" width="76" height="22" rx="4" fill="#0b0e13" fill-opacity=".5"/>
    <!-- 模式盘 -->
    <rect x="300" y="308" width="86" height="32" rx="8" fill="url(#g7Body)"/>
    <!-- 对焦环 -->
    <rect x="330" y="404" width="60" height="8" rx="4" fill="#8b95a6" stroke="none" opacity=".35"/>
  </g>

  <!-- 卡口与套机镜头 -->
  <g transform="translate(508 452)">
    <circle r="96" fill="#0b0e13" stroke="#8b95a6" stroke-opacity=".6" stroke-width="3"/>
    <circle r="76" fill="url(#g7Glass)" stroke="#8b95a6" stroke-opacity=".32" stroke-width="2"/>
    <circle r="44" fill="#0b0e13" fill-opacity=".5" stroke="#8b95a6" stroke-opacity=".24" stroke-width="2"/>
    <circle cx="-26" cy="-30" r="12" fill="#cfe8ff" fill-opacity=".2"/>
  </g>

  <!-- 旁边放一支 M4/3 定焦，做一个体积对比 -->
  <g transform="translate(880 452)">
    <rect x="-52" y="-150" width="104" height="300" rx="16" fill="url(#g7Body)" stroke="#8b95a6" stroke-opacity=".5" stroke-width="2.5"/>
    <rect x="-54" y="-96" width="108" height="14" fill="#8b95a6" fill-opacity=".28"/>
    <rect x="-54" y="40" width="108" height="10" fill="#8b95a6" fill-opacity=".2"/>
    <ellipse cx="0" cy="-146" rx="52" ry="12" fill="#0b0e13" stroke="#8b95a6" stroke-opacity=".35" stroke-width="2"/>
  </g>

  <text x="272" y="366" fill="#8b95a6" font-family="ui-monospace, monospace" font-size="20" letter-spacing="3" opacity=".6">LUMIX G7</text>
  <text x="272" y="700" fill="#8b95a6" font-family="ui-monospace, monospace" font-size="19" letter-spacing="3" opacity=".45">16MP · M4/3 · 4K/30P · 约 410G</text>
</svg>
