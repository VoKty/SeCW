<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" role="img" aria-label="追随拍摄产生的横向动态模糊">
  <title>追随</title>
  <defs>
    <linearGradient id="trackBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0c11"/>
      <stop offset=".42" stop-color="#141821"/>
      <stop offset=".72" stop-color="#0e1219"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="streakA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd7a0" stop-opacity="0"/>
      <stop offset=".45" stop-color="#ffd7a0" stop-opacity=".72"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streakB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfe6ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#bfe6ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5cc7ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="motionBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3 12"/>
    </filter>
    <filter id="motionBlurSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2 22"/>
    </filter>
  </defs>

  <rect width="1400" height="700" fill="url(#trackBg)"/>

  <!-- 速度线：全部横向，长度不一 -->
  <g filter="url(#motionBlurSoft)">
    <rect x="60" y="120" width="700" height="5" fill="url(#streakA)"/>
    <rect x="300" y="196" width="900" height="4" fill="url(#streakB)"/>
    <rect x="0" y="268" width="1050" height="7" fill="url(#streakA)"/>
    <rect x="180" y="344" width="820" height="4" fill="url(#streakB)"/>
    <rect x="420" y="418" width="980" height="6" fill="url(#streakA)"/>
    <rect x="40" y="486" width="760" height="4" fill="url(#streakB)"/>
    <rect x="260" y="556" width="900" height="5" fill="url(#streakA)"/>
    <rect x="620" y="622" width="700" height="4" fill="url(#streakB)"/>
  </g>

  <!-- 主体的拖影 -->
  <g filter="url(#motionBlur)" opacity=".55">
    <rect x="520" y="300" width="380" height="86" rx="10" fill="#e9e2d6"/>
    <rect x="470" y="322" width="520" height="42" rx="8" fill="#ffb057"/>
  </g>

  <!-- 主体：相对清晰，但边缘还是糊的 -->
  <g>
    <rect x="600" y="288" width="330" height="94" rx="12" fill="#1c2029"/>
    <rect x="600" y="288" width="330" height="94" rx="12" fill="none" stroke="#f0e6d6" stroke-opacity=".5" stroke-width="2"/>
    <rect x="640" y="312" width="120" height="26" rx="4" fill="#ffcf87" opacity=".85"/>
    <rect x="778" y="318" width="60" height="16" rx="3" fill="#9fd2ff" opacity=".6"/>
    <circle cx="606" cy="382" r="26" fill="#0a0c11" stroke="#cfc6b8" stroke-opacity=".45" stroke-width="3"/>
    <circle cx="924" cy="382" r="26" fill="#0a0c11" stroke="#cfc6b8" stroke-opacity=".45" stroke-width="3"/>
  </g>

  <!-- 路面的反光 -->
  <rect x="0" y="500" width="1400" height="200" fill="#05070b" opacity=".7"/>
  <g opacity=".3">
    <rect x="200" y="520" width="500" height="3" fill="#ffce8f"/>
    <rect x="480" y="560" width="620" height="3" fill="#9fd2ff"/>
    <rect x="120" y="612" width="420" height="2" fill="#ffce8f"/>
  </g>
</svg>
