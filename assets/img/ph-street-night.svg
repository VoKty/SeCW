<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" aria-label="雨后街道与路灯反光">
  <title>雨后</title>
  <defs>
    <linearGradient id="streetSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1018"/>
      <stop offset=".5" stop-color="#182130"/>
      <stop offset="1" stop-color="#2a3547"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a202b"/>
      <stop offset=".45" stop-color="#10151d"/>
      <stop offset="1" stop-color="#080b11"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe3b0" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#ffbe6b" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffbe6b" stop-opacity="0"/>
    </radialGradient>
    <filter id="streetBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="850" fill="url(#streetSky)"/>

  <!-- 远处楼体轮廓 -->
  <g fill="#0d1420" opacity=".9">
    <rect x="0" y="300" width="180" height="240"/>
    <rect x="200" y="250" width="120" height="290"/>
    <rect x="880" y="270" width="140" height="270"/>
    <rect x="1040" y="320" width="160" height="220"/>
  </g>
  <g fill="#ffd79a" opacity=".4">
    <rect x="26" y="340" width="8" height="6"/><rect x="60" y="380" width="8" height="6"/>
    <rect x="230" y="290" width="8" height="6"/><rect x="264" y="330" width="8" height="6"/>
    <rect x="910" y="310" width="8" height="6"/><rect x="960" y="360" width="8" height="6"/>
    <rect x="1076" y="356" width="8" height="6"/><rect x="1120" y="400" width="8" height="6"/>
  </g>

  <!-- 路面 -->
  <rect x="0" y="540" width="1200" height="310" fill="url(#asphalt)"/>
  <rect x="0" y="536" width="1200" height="5" fill="#39445a" opacity=".5"/>

  <!-- 路灯 -->
  <g>
    <rect x="246" y="300" width="6" height="250" fill="#242b38"/>
    <rect x="250" y="296" width="54" height="6" rx="3" fill="#242b38"/>
    <circle cx="304" cy="316" r="9" fill="#ffeccb"/>
    <circle cx="304" cy="316" r="70" fill="url(#lampGlow)"/>

    <rect x="906" y="270" width="6" height="280" fill="#242b38"/>
    <rect x="856" y="266" width="54" height="6" rx="3" fill="#242b38"/>
    <circle cx="856" cy="286" r="8" fill="#ffeccb"/>
    <circle cx="856" cy="286" r="58" fill="url(#lampGlow)" opacity=".8"/>
  </g>

  <!-- 湿地反射：垂直拉长的光柱 -->
  <g filter="url(#streetBlur)">
    <rect x="286" y="546" width="36" height="150" fill="#ffd08a" opacity=".3"/>
    <rect x="840" y="546" width="30" height="120" fill="#ffd08a" opacity=".24"/>
    <rect x="200" y="546" width="200" height="10" fill="#e8d2b4" opacity=".12"/>
  </g>

  <!-- 水面上的横向碎光 -->
  <g fill="#f4e3c8" opacity=".28">
    <rect x="120" y="600" width="70" height="3" rx="1.5"/>
    <rect x="280" y="640" width="110" height="3" rx="1.5"/>
    <rect x="450" y="612" width="46" height="2" rx="1"/>
    <rect x="700" y="672" width="90" height="3" rx="1.5"/>
    <rect x="880" y="628" width="60" height="2" rx="1"/>
    <rect x="1010" y="700" width="120" height="3" rx="1.5"/>
    <rect x="60" y="740" width="160" height="4" rx="2"/>
    <rect x="620" y="764" width="200" height="4" rx="2"/>
  </g>

  <!-- 人行道边线 -->
  <path d="M0 850 L1200 850 L1200 790 L0 820 Z" fill="#2b3140" opacity=".45"/>
</svg>
