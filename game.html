<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>高三1班的一天</title>
<style>
:root{
  --bg-top:#0B0E1A; --bg-bottom:#131A2E; --bg-deep:#1B1030;
  --card:rgba(26,33,56,.95);
  --neon:#38F2C8; --neon-pink:#FF4FA3; --neon-yellow:#FFD84D; --neon-blue:#4DA3FF;
  --text-main:#EAF2FF; --text-dim:#9AA8C4;
  --tile:#151D30; --stroke:#232C46; --choice:#161E33;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg-top);color:var(--text-main);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
#app{
  position:fixed;inset:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 50%,var(--bg-deep) 100%);
  padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);
}
.hidden{display:none!important}
.scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1 1 auto}

/* ---------- 首页 ---------- */
.header{padding:14px 18px 6px;flex:0 0 auto;text-align:center}
.title{display:inline-block;font-size:27px;font-weight:900;letter-spacing:3px;color:var(--neon);
  text-shadow:0 0 18px rgba(56,242,200,.35)}
.school{color:var(--text-dim);font-size:12.5px;line-height:1.5;margin-top:4px}
.meta-line{color:var(--neon-pink);font-size:12px}

.tabs{display:flex;padding:6px 14px;flex:0 0 auto}
.tab{flex:1 1 0;margin:0 3px;padding:9px 0;text-align:center;border-radius:10px;
  font-size:13.5px;font-weight:500;color:var(--text-dim);
  background:var(--tile);border:1px solid var(--stroke);cursor:pointer;
  transition:background .18s,border-color .18s,color .18s}
.tab.on{background:rgba(56,242,200,.16);border-color:rgba(56,242,200,.7);
  color:var(--neon);font-weight:800}

.list{padding:4px 14px 14px}
.stu{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:8px;
  background:var(--tile);border:1px solid var(--stroke);border-radius:12px;cursor:pointer;
  transition:background .15s,border-color .15s}
.stu.on{background:rgba(56,242,200,.13);border:1.5px solid var(--neon)}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:13px;flex:0 0 32px}
.avatar.male{background:rgba(77,163,255,.2);color:var(--neon-blue)}
.avatar.female{background:rgba(255,79,163,.2);color:var(--neon-pink)}
.stu-name{flex:1 1 auto;font-size:15px;font-weight:700;color:var(--text-main);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu.on .stu-name{color:var(--neon)}
.tag{padding:2px 8px;border-radius:6px;background:var(--stroke);
  color:var(--text-dim);font-size:11px;white-space:nowrap}
.star{color:var(--neon-yellow);font-size:15px;margin-left:6px;line-height:1}

.panel{background:var(--card);border:1px solid rgba(56,242,200,.35);border-radius:18px;
  box-shadow:0 0 24px 1px rgba(56,242,200,.12)}
.cls{margin-bottom:10px;overflow:hidden}
.cls-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer}
.cls-head .chev{margin-left:auto;color:var(--neon);transition:transform .2s;font-size:13px}
.cls.open .chev{transform:rotate(180deg);color:var(--neon-pink)}
.cls-title{font-size:15px;font-weight:800;color:var(--text-main)}
.cls-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px}
.cls-body{display:none;padding:0 12px 10px}
.cls.open .cls-body{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipname{padding:4px 8px;border-radius:7px;font-size:12px}
.chipname.male{background:rgba(77,163,255,.1);color:#BBD8FF}
.chipname.female{background:rgba(255,79,163,.1);color:#FFC4DF}

.teacher{margin-bottom:10px;padding:14px}
.t-row{display:flex;align-items:center;gap:8px}
.t-subject{padding:3px 8px;border-radius:6px;background:rgba(56,242,200,.16);
  color:var(--neon);font-size:11.5px}
.t-name{font-size:16px;font-weight:800;color:var(--text-main)}
.t-title{color:var(--neon-pink);font-size:11.5px}
.t-persona{color:var(--text-dim);font-size:12.6px;line-height:1.7;margin-top:8px}

.startbar{padding:6px 16px 14px;flex:0 0 auto}
.btn-neon{display:flex;align-items:center;justify-content:center;width:100%;height:54px;
  border:none;border-radius:16px;background:var(--neon);color:#06121A;
  font-size:15.5px;font-weight:900;letter-spacing:.5px;cursor:pointer;
  font-family:inherit;transition:filter .15s}
.btn-neon:active{filter:brightness(.92)}

/* ---------- 游戏页 ---------- */
.ghead{padding:8px 10px 2px 14px;flex:0 0 auto}
.ghead-row{display:flex;align-items:center;gap:8px}
.timebox{padding:4px 9px;border-radius:8px;
  background:linear-gradient(90deg,var(--neon),var(--neon-blue));
  color:#06121A;font-weight:900;font-size:13px;white-space:nowrap}
.place{flex:1 1 auto;font-size:13.5px;font-weight:700;color:var(--text-main);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:17px;cursor:pointer;flex:0 0 40px}
.iconbtn:active{background:rgba(255,255,255,.08)}
.bar{height:3px;border-radius:6px;background:#1B2338;overflow:hidden;margin-top:2px}
.bar>i{display:block;height:100%;background:var(--neon-pink);
  transition:width .3s cubic-bezier(.2,.7,.3,1)}

/* 属性栏 */
.statsbar{margin:4px 12px 6px;padding:6px 8px;background:rgba(14,20,36,.8);
  border:1px solid rgba(56,242,200,.25);border-radius:14px;flex:0 0 auto}
.statsbar.full{padding:10px 12px}
.statsbar-title{display:flex;align-items:center;gap:6px;margin-bottom:8px;
  color:rgba(56,242,200,.9);font-size:12.5px;font-weight:700;letter-spacing:1.5px}
.stat-grid{display:flex;flex-wrap:wrap;gap:8px}
.stat{flex:0 0 calc((100% - 16px)/3);min-width:0}
.statsbar.full .stat{flex:0 0 calc((100% - 16px)/3)}
@media (max-width:560px){.statsbar.full .stat{flex:0 0 calc((100% - 8px)/2)}}
.stat-top{display:flex;align-items:center;gap:4px;font-size:10.5px}
.stat-emoji{font-size:11px}
.stat-label{flex:1 1 auto;color:var(--text-dim);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.stat-val{font-weight:800;font-size:11.5px}
.stat-track{height:4px;border-radius:4px;background:var(--stroke);
  overflow:hidden;margin-top:3px}
.stat-track>i{display:block;height:100%;transition:width .35s cubic-bezier(.2,.7,.3,1)}
.statsbar.full .stat-top{font-size:12px}
.statsbar.full .stat-emoji{font-size:13px}
.statsbar.full .stat-val{font-size:13.5px}
.statsbar.full .stat-track{height:5.5px}

/* 事件卡 */
.glist{padding:4px 14px 24px}
.event-card{padding:16px}
.ec-row{display:flex;align-items:center;gap:8px}
.period{padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:700;white-space:nowrap}
.ec-title{flex:1 1 auto;font-size:18px;font-weight:900;letter-spacing:.6px;
  color:var(--text-main)}
.ec-who{display:flex;align-items:center;gap:8px;margin-top:10px}
.ec-who .avatar{width:30px;height:30px;flex:0 0 30px;font-size:12px}
.ec-who-t{flex:1 1 auto;color:var(--neon-blue);font-size:12.5px}
.ec-text{margin-top:12px;font-size:16.2px;line-height:1.92;color:var(--text-main);
  white-space:pre-wrap;word-break:break-word}
.ec-speaker{display:flex;align-items:center;gap:5px;margin-top:10px;
  color:var(--text-dim);font-size:12px}

/* 选项 */
.choice{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;margin-bottom:10px;
  background:var(--choice);border:1.1px solid rgba(56,242,200,.32);border-radius:14px;
  cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.choice:active{transform:scale(.995)}
.choice.dis{opacity:.55;pointer-events:none}
.c-idx{width:22px;height:22px;flex:0 0 22px;border-radius:7px;display:flex;
  align-items:center;justify-content:center;background:rgba(56,242,200,.16);
  color:var(--neon);font-size:12px;font-weight:900}
.c-body{flex:1 1 auto;min-width:0}
.c-text{font-size:14.8px;line-height:1.45;font-weight:600;color:var(--text-main)}
.c-eff{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.c-eff>span{padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:700}
.c-chev{color:var(--text-dim);font-size:15px;line-height:22px}

.fade-in{animation:fade .42s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Delta toast */
.tost{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.tost>span{padding:5px 9px;border-radius:20px;font-size:12px;font-weight:700;
  border:1px solid}

.note{margin-top:8px;color:var(--text-dim);font-size:12px}

/* ---------- 底部弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;
  align-items:flex-end;z-index:50;animation:maskin .2s ease-out}
@keyframes maskin{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-height:88vh;display:flex;flex-direction:column;
  background:#0E1424;border-radius:26px 26px 0 0;border-top:1.4px solid var(--neon);
  animation:sheetin .25s cubic-bezier(.2,.8,.3,1)}
@keyframes sheetin{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet.log{background:#111828;border-radius:22px 22px 0 0;border-top:none;height:72vh}
.sheet-hd{flex:0 0 auto;padding:12px 0 0}
.grab{width:40px;height:4px;border-radius:2px;background:var(--text-dim);margin:0 auto}
.sheet-title{padding:14px;font-size:17px;font-weight:800;text-align:left}
.sheet-scroll{overflow-y:auto;padding:0 20px 26px;flex:1 1 auto}
.log .sheet-scroll{padding:0 16px 26px}

/* 日志 */
.log-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.log-dot{width:9px;height:9px;border-radius:50%;background:var(--neon);flex:0 0 9px}
.log-line{width:2px;height:34px;background:rgba(56,242,200,.25);margin-top:2px}
.log-t1{font-size:13.5px;font-weight:700}
.log-t2{font-size:12px;color:var(--text-dim)}

/* 结算 */
.ending{display:flex;flex-direction:column;align-items:center;text-align:center}
.ending-emoji{font-size:52px;line-height:1.2}
.ending-kicker{color:var(--text-dim);font-size:12px;letter-spacing:3px;margin-top:6px}
.ending-title{font-size:26px;font-weight:900;color:var(--neon);letter-spacing:2px;
  margin-top:6px;text-shadow:0 0 18px rgba(56,242,200,.35)}
.ending-sub{color:var(--neon-pink);font-size:13px;margin-top:4px}
.badge{margin-top:10px;padding:4px 10px;border-radius:20px;
  border:1px solid rgba(255,216,77,.5);background:rgba(255,216,77,.12);
  color:var(--neon-yellow);font-size:12px}
.desc{width:100%;padding:14px;background:var(--tile);border-radius:14px;
  border:1px solid rgba(56,242,200,.2);font-size:13.6px;line-height:1.8;
  color:var(--text-main);text-align:left;white-space:pre-wrap;margin-top:16px}
.score-row{display:flex;gap:8px;margin-top:12px;width:100%}
.score{flex:1 1 0;padding:10px 0;border-radius:12px;text-align:center;border:1px solid}
.score-v{font-size:17px;font-weight:900}
.score-l{font-size:11px;color:var(--text-dim);margin-top:2px}
.quotes{margin-top:14px;width:100%;text-align:left}
.quotes h4{margin:0;color:var(--neon);font-size:13px;font-weight:700}
.quotes p{margin:6px 0 0;color:var(--text-dim);font-size:12.5px;line-height:1.5}
.again{width:100%;height:50px;border:none;border-radius:14px;background:var(--neon);
  color:#06121A;font-size:16px;font-weight:900;cursor:pointer;margin-top:18px;
  font-family:inherit}

/* 加载/错误 */
.center{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:24px}
.spinner{width:46px;height:46px;border-radius:50%;
  border:3px solid rgba(56,242,200,.2);border-top-color:var(--neon);
  animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-t{color:var(--text-dim);letter-spacing:2px}
.err-t{font-size:20px;font-weight:800}
.err-d{color:var(--text-dim);font-size:12px;text-align:center;word-break:break-all}
</style>

  this.text=String(json&&json.text!=null?json.text:'');
  this.character=(rawChar===null||rawChar===''||rawChar==='null')?null:rawChar;
  this.choices=ch;
  this.isEnding=!!(json&&json.isEnding===true);
}

/* ================= GameEngine 移植 ================= */
function GameEngine(events,ordered,startEventId,endings,meta){
  this.events=events; this.orderedEvents=ordered;
  this.startEventId=startEventId; this.endings=endings; this.meta=meta;
  this.stats=Object.assign({},Stats.initial);
  this.visited=[]; this.allDeltas=[]; this.notes=[]; this.choicesMade=[];
  this.currentEventId=startEventId; this.step=0; this.playerName='无名之辈';
}
Object.defineProperty(GameEngine.prototype,'currentEvent',{get:function(){
  return this.events[this.currentEventId]||this.events[this.startEventId];
}});
Object.defineProperty(GameEngine.prototype,'totalStat',{get:function(){
  let s=0; for(const k of Stats.keys) s+=(this.stats[k]||0); return s;
}});
Object.defineProperty(GameEngine.prototype,'nodeCount',{get:function(){
  return Object.keys(this.events).length;
}});
Object.defineProperty(GameEngine.prototype,'progress',{get:function(){
  return Math.min(1.0,this.visited.length/Math.max(1,Math.min(40,this.nodeCount)));
}});
GameEngine.prototype.resolve=function(raw){
  const n=this.playerName==null?'':String(this.playerName);
  return String(raw==null?'':raw).split('{player}').join(n).split('{主角}').join(n);
};
GameEngine.prototype.nextEventIdFor=function(choice){
  const next=choice.next;
  if(next.startsWith('ENDING:')) return next;
  if(next==='JUDGE'||next==='RESTART') return 'ENDING:'+this.resolveEndingKey();
  if(Object.prototype.hasOwnProperty.call(this.events,next)) return next;
  return 'ENDING:mediocre';
};
GameEngine.prototype.resolveEndingKey=function(){
  const sw=this.stats[Stats.swagger]||0, tf=this.stats[Stats.teacherFavor]||0;
  const lv=this.stats[Stats.love]||0, hw=this.stats[Stats.homework]||0;
  const st=this.stats[Stats.stamina]||0, cr=this.stats[Stats.caughtRisk]||0;
  if(st<=20&&hw<=30&&sw>=55) return 'hidden';
  if(cr>=82) return 'focus';
  if(cr>=70&&tf<=35) return 'focus';
  if(lv>=70&&hw>=35) return 'love';
  if(hw>=95&&cr<55) return 'grind';
  if(hw>=88&&st<=30) return 'grind';
  if(sw>=68&&hw<85) return 'king';
  if(sw>=62&&tf>=60) return 'king';
  if(sw>=50&&hw<=40&&st<=35) return 'hidden';
  return 'mediocre';
};
GameEngine.prototype.applyChoice=function(choice){
  const applied=[];
  const safe=choice.safeEffects();
  for(const k of Object.keys(safe)){
    const v=safe[k];
    const before=this.stats[k]||0;
    const after=Stats.clamp(before+v);
    this.stats[k]=after;
    if(after!==before){
      applied.push({key:k,delta:after-before});
      this.allDeltas.push({key:k,delta:after-before});
    }
  }
  this.choicesMade.push(choice.text);
  if(choice.note&&choice.note.length>0) this.notes.push(choice.note);
  this.step++;
  return applied;
};
GameEngine.prototype.goTo=function(id){
  this.currentEventId=id;
  if(!this.visited.includes(id)) this.visited.push(id);
};
GameEngine.prototype.endingFor=function(e){
  const key=keyFromNext(e.choices[0].next);
  return this.endings[key]||EndingAll[key]||EndingAll.mediocre;
};
GameEngine.fromJsonString=function(raw){
  const root=JSON.parse(raw);
  const map={}, ordered=[];
  const rawEvents=root.events;
  if(Array.isArray(rawEvents)){
    for(const item of rawEvents){
      if(item&&typeof item==='object'&&!Array.isArray(item)){
        const e=new GameEvent(item);
        if(e.id.length>0&&!Object.prototype.hasOwnProperty.call(map,e.id)){
          map[e.id]=e; ordered.push(e);
        }
      }
    }
  }
  if(Object.keys(map).length===0){
    const fb=new GameEvent({id:'fallback',time:'07:30',place:'高三1班',period:'早读',
      title:'空教室',speaker:'旁白',text:'教室里一片空白。看来档案丢了。',
      choices:[{text:'算了，毕业吧',next:'JUDGE'}],isEnding:false});
    map[fb.id]=fb; ordered.push(fb);
  }
  const ends={};
  const rawEndings=root.endings;
  if(rawEndings&&typeof rawEndings==='object'&&!Array.isArray(rawEndings)){
    for(const k of Object.keys(rawEndings)){
      const v=rawEndings[k];
      let base=EndingAll[k]||EndingAll.mediocre;
      if(v&&typeof v==='object'&&!Array.isArray(v)){
        const t=String(v.title!=null?v.title:'');
        const d=String(v.description!=null?v.description:'');
        if(t.length>1||d.length>5){
          base={key:k,
            title:v.title!=null?String(v.title):base.title,
            subtitle:v.subtitle!=null?String(v.subtitle):base.subtitle,
            emoji:v.emoji!=null?String(v.emoji):base.emoji,
            description:v.description!=null?String(v.description):base.description,
            badge:v.badge!=null?String(v.badge):base.badge};
        }
      }
      ends[k]=base;
    }
  }
  const rawMeta=root.meta;
  const metaMap=(rawMeta&&typeof rawMeta==='object'&&!Array.isArray(rawMeta))
    ? Object.assign({},rawMeta) : {};
  const initFromJson={};
  const absorb=function(rawInit){
    if(!rawInit||typeof rawInit!=='object'||Array.isArray(rawInit)) return;
    for(const k of Object.keys(rawInit)){
      const v=rawInit[k];
      if(typeof v==='number'&&Stats.keys.includes(k)) initFromJson[k]=Math.trunc(v);
    }
  };
  absorb(metaMap.initial); absorb(root.initial);

  let start=root.startEvent!=null?root.startEvent
    :(metaMap.startEvent!=null?metaMap.startEvent:Object.keys(map)[0]);
  start=String(start);
  const safeStart=Object.prototype.hasOwnProperty.call(map,start)?start:Object.keys(map)[0];

  const resolvedInitial=Object.assign({},Stats.initial,initFromJson);
  const engine=new GameEngine(map,ordered,safeStart,ends,
    Object.assign({},metaMap,{initial:resolvedInitial}));
  engine.stats=Object.assign({},resolvedInitial);
  engine.visited.push(safeStart);
  if(Object.keys(ends).length===0){
    for(const k of Object.keys(EndingAll)) ends[k]=EndingAll[k];
  }
  return engine;
};
GameEngine.fromScratch=function(template){
  const g=new GameEngine(template.events,template.orderedEvents,
    template.startEventId,template.endings,template.meta);
  const init=template.meta&&template.meta.initial;
  if(init&&typeof init==='object'&&!Array.isArray(init)){
    const resolved=Object.assign({},Stats.initial);
    for(const k of Object.keys(init)){
      const v=init[k];
      if(typeof v==='number'&&Stats.keys.includes(k)) resolved[k]=Math.trunc(v);
    }
    g.stats=Object.assign({},resolved);
  }
  g.visited.push(template.startEventId);
  return g;
};

function Teacher(json){this.subject=String(json.subject!=null?json.subject:'');
  this.name=String(json.name!=null?json.name:'');

  this.title=String(json.title!=null?json.title:'教师');

function Student(json){this.name=String(json.name!=null?json.name:'');
  this.gender=String(json.gender!=null?json.gender:'male');
  this.tag=String(json.tag!=null?json.tag:'普通学生');
  this.isFavoriteNPC=json.isFavoriteNPC===true;}
Object.defineProperty(Student.prototype,'isMale',{get:function(){return this.gender==='male';}});
function ClassRoom(json){
  const list=[]; const raw=json.students;
  if(Array.isArray(raw)) for(const s of raw) if(s&&typeof s==='object') list.push(new Student(s));
  this.id=String(json.id!=null?json.id:''); this.name=String(json.name!=null?json.name:'');
  this.teacher=String(json.teacher!=null?json.teacher:''); this.students=list;}
function WorldData(json){
  const cs=[]; const rawClasses=json.classes;
  if(Array.isArray(rawClasses)) for(const c of rawClasses) if(c&&typeof c==='object') cs.push(new ClassRoom(c));
  const ts=[]; const rawTeachers=json.teachers;
  if(Array.isArray(rawTeachers)) for(const t of rawTeachers) if(t&&typeof t==='object') ts.push(new Teacher(t));
  const rawSchool=json.school;
  const info=(rawSchool&&typeof rawSchool==='object')?{
    name:String(rawSchool.name!=null?rawSchool.name:'苏州市田家炳实验高级中学（新市路校区）'),
    grade:String(rawSchool.grade!=null?rawSchool.grade:'高三'),
    subjectCombo:String(rawSchool.subjectCombo!=null?rawSchool.subjectCombo:'物理+化学+地理'),
    startTime:String(rawSchool.startTime!=null?rawSchool.startTime:'07:30'),
    endTime:String(rawSchool.endTime!=null?rawSchool.endTime:'21:20'),
    classCount:typeof rawSchool.classCount==='number'?Math.trunc(rawSchool.classCount):9
  }:{name:'苏州市田家炳实验高级中学（新市路校区）',grade:'高三',
    subjectCombo:'物理+化学+地理',startTime:'07:30',endTime:'21:20',classCount:9};
  this.school=info; this.classes=cs; this.teachers=ts;
}
Object.defineProperty(WorldData.prototype,'mainClass',{get:function(){
  return this.classes.length?this.classes[0]:
    new ClassRoom({id:'class1',name:'高三1班',teacher:'陆德泉',students:[]});}});
Object.defineProperty(WorldData.prototype,'mainStudents',{get:function(){
  return this.mainClass.students;}});
Object.defineProperty(WorldData.prototype,'favoriteNpcs',{get:function(){
  return this.mainStudents.filter(s=>s.isFavoriteNPC);}});
Object.defineProperty(WorldData.prototype,'headTeacher',{get:function(){

  return this.teachers.length?this.teachers[0]:null;}});
WorldData.prototype.teacherByName=function(name){

};

function HomeScreen(engine,world){
  const state={tab:0,selected:null,openClasses:new Set()};

  // header

  const tabEls=titles.map((t,i)=>{
    const b=el('div','tab'+(i===0?' on':''),esc(t));

    tabs.appendChild(b); return b;
  });
  view.appendChild(tabs);

  const body=el('div','scroll');
  view.appendChild(body);

  // start bar
  const sb=el('div','startbar');
  const startBtn=el('button','btn-neon');
  sb.appendChild(startBtn); view.appendChild(sb);

  function sync(){
    tabEls.forEach((b,i)=>b.classList.toggle('on',state.tab===i));
    body.innerHTML='';
    if(state.tab===0) body.appendChild(pickTab());
    else if(state.tab===1) body.appendChild(rosterTab());
    else body.appendChild(infoTab());
    startBtn.textContent=state.selected==null
      ? '选中主角后开工（点击上方姓名）'
      : '▶ 以「'+state.selected+'」的身份开始这一天';
  }

  function pickTab(){
    const list=el('div','list');
    for(const s of world.mainStudents){
      const on=state.selected===s.name;
      const row=el('div','stu'+(on?' on':''));
      row.innerHTML=
        '<div class="avatar '+(s.isMale?'male':'female')+'">'+
          esc(s.name.substring(0,1))+'</div>'+
        '<div class="stu-name">'+esc(s.name)+'</div>'+
        '<div class="tag">'+esc(s.tag)+'</div>'+
        (s.isFavoriteNPC?'<div class="star">★</div>':'');
      row.onclick=()=>{state.selected=s.name;sync();};
      list.appendChild(row);
    }
    return list;
  }

  function rosterTab(){
    const list=el('div','list');
    for(const c of world.classes){
      const male=c.students.filter(s=>s.isMale).length;
      const card=el('div','cls panel'+(state.openClasses.has(c.id)?' open':''));
      const head=el('div','cls-head');
      head.innerHTML='<div><div class="cls-title">'+esc(c.name)+'</div>'+
        '<div class="cls-sub">班主任 '+esc(c.teacher)+' · '+c.students.length+
        ' 人（男 '+male+' / 女 '+(c.students.length-male)+'）</div></div>'+
        '<div class="chev">▼</div>';
      head.onclick=()=>{
        if(state.openClasses.has(c.id)) state.openClasses.delete(c.id);
        else state.openClasses.add(c.id);
        card.classList.toggle('open');
      };
      card.appendChild(head);
      const bd=el('div','cls-body');
      const chips=el('div','chips');
      for(const s of c.students){
        chips.appendChild(el('span','chipname '+(s.isMale?'male':'female'),esc(s.name)));
      }
      bd.appendChild(chips); card.appendChild(bd);
      list.appendChild(card);
    }
    return list;
  }

  function infoTab(){
    const list=el('div','list');
    for(const t of world.teachers){
      const card=el('div','teacher panel');
      let row='<div class="t-subject">'+esc(t.subject)+'</div>'+
        '<div class="t-name">'+esc(t.name)+'</div>';
      if(t.isHeadTeacher) row+='<span style="color:'+COL.pink+';font-size:16px">🔥</span>'+
        '<span class="t-title">'+esc(t.title)+'</span>';
      card.innerHTML='<div class="t-row">'+row+'</div>'+
        '<div class="t-persona">'+esc(t.persona)+'</div>';
      list.appendChild(card);
    }
    return list;
  }

  startBtn.onclick=()=>{
    const name=state.selected!=null?state.selected:
      (world.mainStudents.length?world.mainStudents[0].name:'');
    root.innerHTML='';
    root.appendChild(GameScreen(GameEngine.fromScratch(engine),world,name,()=>{
      root.innerHTML=''; root.appendChild(HomeScreen(engine,world));
    }));
  };

  sync();
  return view;
}

    const text=engine.resolve(e.text);
    const speaker=engine.resolve(e.speaker);
    const character=e.character!=null?engine.resolve(e.character):null;
    const pc=periodColor(e.period);
    card.appendChild(el('div','ec-row',
      '<div class="period" style="background:'+hexToRgba(pc,.14)+
      ';color:'+pc+';border:1px solid '+hexToRgba(pc,.5)+'">'+esc(e.period)+'</div>'+
      '<div class="ec-title">'+esc(title)+'</div>'));
    if(character!=null){
      const who=el('div','ec-who');
      who.innerHTML='<div class="avatar" style="background:rgba(56,242,200,.18);'+
        'color:'+COL.neon+';width:30px;height:30px;flex:0 0 30px;border-radius:50%;'+
        'display:flex;align-items:center;justify-content:center;font-weight:800">'+
        esc(character.length?character.substring(0,1):'?')+'</div>'+
        '<div class="ec-who-t">'+esc(character+' · '+teacherSuffix(character))+'</div>';
      card.appendChild(who);
    }
    card.appendChild(el('div','ec-text',esc(text)));
    card.appendChild(el('div','ec-speaker','<span>💬</span><span>'+esc(speaker)+'</span>'));
    scroll.appendChild(card);

    if(state.lastDeltas.length){
      const toast=el('div','tost');
      for(const d of state.lastDeltas){
        const up=d.delta>0;
        const c=up?'#8CFF9A':'#FF6B6B';
        const s=el('span',null,esc(Stats.labels[d.key])+' '+(up?'+':'')+d.delta);
        s.style.color=c;
        s.style.background=hexToRgba(c,.12);
        s.style.borderColor=hexToRgba(c,.55);
        toast.appendChild(s);
      }
      scroll.appendChild(toast);
    }

    const gap=el('div'); gap.style.height='14px'; scroll.appendChild(gap);

    e.choices.forEach((c,i)=>{
      const tile=el('div','choice'+(state.busy?' dis':''));
      const cbody=el('div','c-body');
      cbody.appendChild(el('div','c-text',esc(c.text)));
      const safe=c.safeEffects();
      const keys=Object.keys(safe);
      if(keys.length){
        const eff=el('div','c-eff');
        for(const k of keys){
          const v=safe[k], up=v>0, risk=(k===Stats.caughtRisk);
          const cc=risk?(up?'#FF9C5A':'#8CFF9A'):(up?'#8CFF9A':'#FF6B6B');
          const sp=el('span',null,esc(Stats.labels[k])+(up?'+':'')+v);
          sp.style.color=cc; sp.style.background=hexToRgba(cc,.1);
          eff.appendChild(sp);
        }
        cbody.appendChild(eff);
      }
      tile.innerHTML='<div class="c-idx">'+String.fromCharCode(65+i)+'</div>';
      tile.appendChild(cbody);
      tile.appendChild(el('div','c-chev','›'));
      tile.onclick=()=>choose(c);
      scroll.appendChild(tile);
    });

    if(engine.notes.length){
      scroll.appendChild(el('div','note','📌 记录：'+esc(engine.notes[engine.notes.length-1])));
    }
  }

  function choose(c){
    if(state.busy||state.ended) return;
    state.busy=true;
    const deltas=engine.applyChoice(c);
    const nextId=engine.nextEventIdFor(c);
    const toEnding=nextId.startsWith('ENDING:');
    if(!toEnding) engine.goTo(nextId);
    state.lastDeltas=deltas;
    state.busy=false;

    const e=engine.currentEvent;
    renderHeader(e); renderStats(); renderBody(e,!toEnding||true);

    const isEndingNode=!toEnding&&e.isEnding;
    if(isEndingNode||toEnding){
      const key=isEndingNode?keyFromNext(e.choices[0].next):keyFromNext(nextId);
      setTimeout(()=>{
        if(state.ended) return;
        state.ended=true;
        const ending=engine.endings[key]||EndingAll[key]||EndingAll.mediocre;
        const mask=EndingSheet(engine,world,ending,playerName,()=>{
          // 清理全部浮层，避免第二次游玩时叠层
          document.querySelectorAll('body > .mask').forEach(n=>n.remove());
          root.innerHTML=''; onHome();
        });
        document.body.appendChild(mask);
      },320);
    } else {
      scroll.scrollTo({top:0,behavior:'smooth'});
    }
  }

  const e0=engine.currentEvent;
  renderHeader(e0); renderStats(); renderBody(e0,true);
  return view;
}

/* ================= 启动 ================= */
function boot(){
  try{
    const rawEvents=document.getElementById('data-events').textContent;
    const rawStudents=document.getElementById('data-students').textContent;
    const engine=GameEngine.fromJsonString(rawEvents);
    const world=new WorldData(JSON.parse(rawStudents));
    root.innerHTML='';
    root.appendChild(HomeScreen(engine,world));
  }catch(err){
    root.innerHTML='';
    const c=el('div','center');
    c.innerHTML='<div class="err-t">🌙 校园系统崩了</div>'+
      '<div class="err-d">'+esc(err&&err.message?err.message:err)+'</div>'+
      '<button class="btn-neon" style="max-width:180px;height:44px">重试</button>';
    c.querySelector('button').onclick=()=>location.reload();
    root.appendChild(c);
  }
}
boot();
</script>
</body>
</html>
