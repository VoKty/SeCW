<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Canon 1DX 单反机身示意图">
  <title>Canon EOS-1D X · 示意图</title>
  <defs>
    <linearGradient id="bodyMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b95a6" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#5d6675" stop-opacity=".1"/>
      <stop offset="1" stop-color="#2b3140" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="glassCoat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc7ff" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#9a86ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffb057" stop-opacity=".22"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="none"/>
  <g stroke="#8b95a6" fill="none" stroke-width="2.5" stroke-linejoin="round">
    <!-- 机身 -->
    <path d="M300 300 h520 a24 24 0 0 1 24 24 v212 a24 24 0 0 1 -24 24 h-520 a24 24 0 0 1 -24 -24 v-212 a24 24 0 0 1 24 -24 z" fill="url(#bodyMetal)"/>
    <!-- 五棱镜 / 军舰部 -->
    <path d="M470 300 l34 -70 h180 l34 70 z" fill="url(#bodyMetal)"/>
    <rect x="546" y="196" width="72" height="34" rx="6" fill="url(#bodyMetal)"/>
    <!-- 一体式竖拍手柄 + 快门 -->
    <path d="M276 330 h-44 a18 18 0 0 0 -18 18 v168 a18 18 0 0 0 18 18 h44"/>
    <circle cx="243" cy="352" r="11" fill="url(#bodyMetal)"/>
    <!-- 顶部拨盘 -->
    <rect x="640" y="272" width="118" height="30" rx="8" fill="url(#bodyMetal)"/>
    <rect x="352" y="272" width="74" height="30" rx="8" fill="url(#bodyMetal)"/>
    <rect x="778" y="276" width="46" height="26" rx="6" fill="url(#bodyMetal)"/>
  </g>

  <!-- 卡口与镜组 -->
  <g transform="translate(560 420)">
    <circle r="122" fill="#0b0e13" stroke="#8b95a6" stroke-opacity=".65" stroke-width="3"/>
    <circle r="100" fill="url(#glassCoat)" stroke="#8b95a6" stroke-opacity=".35" stroke-width="2"/>
    <circle r="66" fill="#0b0e13" fill-opacity=".55" stroke="#8b95a6" stroke-opacity=".28" stroke-width="2"/>
    <circle r="30" fill="#05070a" fill-opacity=".6" stroke="#8b95a6" stroke-opacity=".2" stroke-width="2"/>
    <circle cx="-34" cy="-40" r="16" fill="#cfe8ff" fill-opacity=".22"/>
    <path d="M-100 -46 a100 100 0 0 1 66 -52" stroke="#cfe8ff" stroke-opacity=".35" stroke-width="3" fill="none"/>
  </g>

  <!-- 肩屏与标签 -->
  <g fill="#8b95a6" fill-opacity=".55">
    <rect x="796" y="330" width="60" height="34" rx="4"/>
    <rect x="330" y="352" width="86" height="52" rx="6"/>
  </g>
  <text x="262" y="332" fill="#8b95a6" font-family="ui-monospace, monospace" font-size="22" letter-spacing="4" opacity=".65">EOS-1D X</text>
  <text x="330" y="640" fill="#8b95a6" font-family="ui-monospace, monospace" font-size="20" letter-spacing="3" opacity=".45">18.1MP · FULL FRAME · 12 FPS</text>
</svg>
