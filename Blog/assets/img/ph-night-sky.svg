<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" width="1000" height="1400" role="img" aria-label="夜空与银河，前景山脊剪影">
  <title>夜空 · 银河</title>
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060f"/>
      <stop offset=".42" stop-color="#0a1024"/>
      <stop offset=".78" stop-color="#141d38"/>
      <stop offset="1" stop-color="#26304d"/>
    </linearGradient>
    <linearGradient id="milky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa9d8" stop-opacity=".05"/>
      <stop offset=".4" stop-color="#cdd7ea" stop-opacity=".3"/>
      <stop offset=".6" stop-color="#e6cfae" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8f7fb0" stop-opacity=".05"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1000" height="1400" fill="url(#nightSky)"/>

  <!-- 银河：一条斜带，用几层模糊椭圆叠出来 -->
  <g transform="rotate(-28 500 520)" filter="url(#soft)" opacity=".85">
    <ellipse cx="500" cy="470" rx="120" ry="520" fill="url(#milky)"/>
    <ellipse cx="470" cy="560" rx="60" ry="360" fill="#e8dcc6" opacity=".1"/>
    <ellipse cx="540" cy="380" rx="150" ry="240" fill="#9fb4dc" opacity=".08"/>
  </g>

  <!-- 星野 -->
  <g fill="#ffffff">
    <circle cx="96" cy="112" r="1.6" opacity=".9"/><circle cx="188" cy="64" r="1.1" opacity=".6"/>
    <circle cx="264" cy="168" r="1.4" opacity=".75"/><circle cx="352" cy="96" r="1" opacity=".5"/>
    <circle cx="438" cy="182" r="1.8" opacity=".95"/><circle cx="528" cy="88" r="1.2" opacity=".65"/>
    <circle cx="612" cy="204" r="1.5" opacity=".8"/><circle cx="704" cy="126" r="1.1" opacity=".55"/>
    <circle cx="806" cy="188" r="1.7" opacity=".88"/><circle cx="898" cy="104" r="1.3" opacity=".7"/>
    <circle cx="143" cy="286" r="1.2" opacity=".62"/><circle cx="238" cy="356" r="1.6" opacity=".82"/>
    <circle cx="330" cy="272" r="1" opacity=".48"/><circle cx="420" cy="392" r="1.4" opacity=".72"/>
    <circle cx="512" cy="300" r="1.1" opacity=".58"/><circle cx="598" cy="420" r="1.7" opacity=".9"/>
    <circle cx="690" cy="318" r="1.2" opacity=".64"/><circle cx="784" cy="404" r="1.5" opacity=".78"/>
    <circle cx="880" cy="322" r="1" opacity=".5"/><circle cx="944" cy="430" r="1.3" opacity=".68"/>
    <circle cx="72" cy="486" r="1.5" opacity=".76"/><circle cx="166" cy="560" r="1.1" opacity=".56"/>
    <circle cx="262" cy="498" r="1.7" opacity=".86"/><circle cx="358" cy="590" r="1.2" opacity=".6"/>
    <circle cx="452" cy="516" r="1.4" opacity=".74"/><circle cx="548" cy="606" r="1.1" opacity=".52"/>
    <circle cx="644" cy="530" r="1.6" opacity=".84"/><circle cx="738" cy="614" r="1.3" opacity=".66"/>
    <circle cx="834" cy="546" r="1" opacity=".46"/><circle cx="922" cy="620" r="1.5" opacity=".78"/>
    <circle cx="118" cy="690" r="1.2" opacity=".58"/><circle cx="212" cy="760" r="1.4" opacity=".7"/>
    <circle cx="306" cy="686" r="1" opacity=".5"/><circle cx="398" cy="774" r="1.5" opacity=".76"/>
    <circle cx="494" cy="700" r="1.1" opacity=".54"/><circle cx="588" cy="782" r="1.3" opacity=".66"/>
    <circle cx="682" cy="706" r="1.6" opacity=".82"/><circle cx="778" cy="792" r="1" opacity=".46"/>
    <circle cx="872" cy="722" r="1.4" opacity=".72"/><circle cx="948" cy="804" r="1.2" opacity=".6"/>
  </g>

  <!-- 亮星与光晕 -->
  <g filter="url(#softer)">
    <circle cx="438" cy="182" r="5" fill="#dbe7ff" opacity=".55"/>
    <circle cx="806" cy="188" r="4" fill="#ffe9cf" opacity=".5"/>
    <circle cx="238" cy="356" r="4" fill="#dbe7ff" opacity=".45"/>
    <circle cx="598" cy="420" r="5" fill="#ffe9cf" opacity=".45"/>
    <circle cx="76" cy="884" r="6" fill="#cfe0ff" opacity=".28"/>
  </g>

  <!-- 前景山脊剪影 -->
  <path d="M0 1080 L120 1010 L230 1072 L340 984 L470 1064 L590 992 L700 1078 L820 1012 L930 1076 L1000 1040 L1000 1400 L0 1400 Z" fill="#080c16"/>
  <path d="M0 1240 L160 1190 L300 1250 L470 1186 L640 1256 L800 1200 L1000 1258 L1000 1400 L0 1400 Z" fill="#04060c"/>
  <!-- 树线 -->
  <g fill="#020408">
    <path d="M180 1196 l10 -34 l10 34 z"/><path d="M214 1206 l8 -26 l8 26 z"/>
    <path d="M660 1208 l11 -36 l11 36 z"/><path d="M700 1220 l8 -24 l8 24 z"/>
    <path d="M860 1206 l10 -30 l10 30 z"/>
  </g>
</svg>
