<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="NAS 与硬盘、网络拓扑示意图">
  <title>NAS · 示意图</title>
  <defs>
    <linearGradient id="nasBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b95a6" stop-opacity=".2"/>
      <stop offset="1" stop-color="#2b3140" stop-opacity=".16"/>
    </linearGradient>
  </defs>

  <!-- 主机 -->
  <g stroke="#8b95a6" fill="none" stroke-width="2.5" stroke-linejoin="round">
    <rect x="200" y="200" width="300" height="380" rx="16" fill="url(#nasBody)"/>
    <!-- 盘位 -->
    <g>
      <rect x="228" y="236" width="244" height="56" rx="8" fill="#8b95a6" fill-opacity=".1"/>
      <rect x="228" y="310" width="244" height="56" rx="8" fill="#8b95a6" fill-opacity=".1"/>
      <rect x="228" y="384" width="244" height="56" rx="8" fill="#8b95a6" fill-opacity=".1"/>
      <rect x="228" y="458" width="244" height="56" rx="8" fill="#8b95a6" fill-opacity=".07"/>
    </g>
    <g fill="#5bd07f" stroke="none">
      <circle cx="250" cy="264" r="5" fill-opacity=".8"/>
      <circle cx="250" cy="338" r="5" fill-opacity=".8"/>
      <circle cx="250" cy="412" r="5" fill-opacity=".8"/>
      <circle cx="250" cy="486" r="5" fill-opacity=".28"/>
    </g>
    <g fill="#8b95a6" stroke="none" opacity=".4">
      <rect x="410" y="256" width="40" height="16" rx="4"/>
      <rect x="410" y="330" width="40" height="16" rx="4"/>
      <rect x="410" y="404" width="40" height="16" rx="4"/>
      <rect x="410" y="478" width="40" height="16" rx="4"/>
    </g>
  </g>

  <!-- 一块抽出来的硬盘 -->
  <g transform="translate(560 300)" stroke="#8b95a6" fill="none" stroke-width="2.5" stroke-linejoin="round">
    <rect x="0" y="0" width="230" height="110" rx="10" fill="url(#nasBody)"/>
    <circle cx="60" cy="55" r="34" fill="#8b95a6" fill-opacity=".1"/>
    <circle cx="60" cy="55" r="10" fill="#8b95a6" fill-opacity=".25"/>
    <rect x="140" y="34" width="70" height="42" rx="6" fill="#8b95a6" fill-opacity=".12"/>
    <rect x="150" y="130" width="16" height="20" fill="#8b95a6" fill-opacity=".2" stroke="none"/>
    <rect x="176" y="130" width="16" height="20" fill="#8b95a6" fill-opacity=".2" stroke="none"/>
  </g>

  <!-- 网络拓扑 -->
  <g transform="translate(600 520)" stroke="#8b95a6" fill="none" stroke-width="2" stroke-opacity=".6">
    <circle cx="60" cy="60" r="34" fill="#5cc7ff" fill-opacity=".1"/>
    <rect x="200" y="30" width="80" height="60" rx="10" fill="#8b95a6" fill-opacity=".1"/>
    <rect x="340" y="30" width="80" height="60" rx="10" fill="#8b95a6" fill-opacity=".1"/>
    <rect x="480" y="30" width="80" height="60" rx="10" fill="#8b95a6" fill-opacity=".1"/>
    <path d="M96 62 h104"/><path d="M282 62 h58"/><path d="M422 62 h58"/>
  </g>
  <g fill="#8b95a6" font-family="ui-monospace, monospace" font-size="16" opacity=".55">
    <text x="640" y="592">NAS</text><text x="772" y="592">PC</text><text x="912" y="592">PHONE</text><text x="1052" y="592">TV</text>
  </g>

  <text x="200" y="654" fill="#8b95a6" font-family="ui-monospace, monospace" font-size="19" letter-spacing="3" opacity=".45">SMB · DOCKER · 备份 · 媒体库</text>
</svg>
