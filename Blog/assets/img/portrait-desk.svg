<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" role="img" aria-label="桌前剪影与屏幕冷光">
  <title>自画像 · 剪影</title>
  <defs>
    <linearGradient id="roomBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d14"/>
      <stop offset=".55" stop-color="#111722"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#bfe2ff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#5cc7ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#5cc7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warmLamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffce8f" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffce8f" stop-opacity="0"/>
    </linearGradient>
    <filter id="roomBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="900" height="1100" fill="url(#roomBg)"/>

  <!-- 台灯暖光 -->
  <path d="M620 300 L900 200 L900 700 L600 620 Z" fill="url(#warmLamp)" filter="url(#roomBlur)"/>

  <!-- 显示器 -->
  <g>
    <rect x="120" y="330" width="480" height="290" rx="12" fill="#0c1018" stroke="#8b95a6" stroke-opacity=".35" stroke-width="2"/>
    <rect x="136" y="346" width="448" height="258" rx="6" fill="#16283a"/>
    <ellipse cx="360" cy="470" rx="380" ry="270" fill="url(#screenGlow)"/>
    <!-- 屏幕上的一点内容 -->
    <g fill="#cfe8ff" fill-opacity=".22">
      <rect x="162" y="374" width="180" height="8" rx="4"/>
      <rect x="162" y="398" width="280" height="6" rx="3"/>
      <rect x="162" y="420" width="230" height="6" rx="3"/>
      <rect x="162" y="442" width="300" height="6" rx="3"/>
      <rect x="162" y="464" width="140" height="6" rx="3"/>
    </g>
    <g fill="#ffb057" fill-opacity=".3">
      <rect x="162" y="504" width="90" height="6" rx="3"/>
      <rect x="266" y="504" width="60" height="6" rx="3"/>
    </g>
    <rect x="330" y="620" width="60" height="52" fill="#0c1018" stroke="#8b95a6" stroke-opacity=".3" stroke-width="2"/>
    <rect x="270" y="672" width="180" height="14" rx="7" fill="#0c1018" stroke="#8b95a6" stroke-opacity=".3" stroke-width="2"/>
  </g>

  <!-- 人物剪影：背对镜头，戴着耳机 -->
  <g fill="#05070c">
    <path d="M300 1100 C300 900 360 820 470 800 C580 820 640 900 640 1100 Z"/>
    <circle cx="470" cy="730" r="86"/>
    <path d="M384 726 C384 654 424 616 470 616 C516 616 556 654 556 726" fill="none" stroke="#05070c" stroke-width="20"/>
  </g>
  <g fill="none" stroke="#8b95a6" stroke-opacity=".28" stroke-width="3">
    <path d="M382 730 C382 656 422 612 470 612 C518 612 558 656 558 730"/>
    <rect x="366" y="712" width="34" height="52" rx="14"/>
    <rect x="540" y="712" width="34" height="52" rx="14"/>
  </g>
  <!-- 屏幕在肩上的一点边缘光 -->
  <path d="M400 812 C440 806 500 806 540 812" stroke="#9fd2ff" stroke-opacity=".3" stroke-width="4" fill="none"/>
  <path d="M420 690 C440 664 500 664 520 690" stroke="#9fd2ff" stroke-opacity=".18" stroke-width="4" fill="none"/>

  <!-- 桌面与杂物 -->
  <rect x="0" y="880" width="900" height="220" fill="#0a0d13"/>
  <rect x="0" y="876" width="900" height="4" fill="#8b95a6" fill-opacity=".16"/>
  <g>
    <rect x="700" y="820" width="150" height="56" rx="10" fill="#111721" stroke="#8b95a6" stroke-opacity=".3" stroke-width="2"/>
    <circle cx="775" cy="848" r="16" fill="#8b95a6" fill-opacity=".14"/>
    <rect x="690" y="770" width="60" height="48" rx="8" fill="#111721" stroke="#8b95a6" stroke-opacity=".25" stroke-width="2"/>
    <rect x="80" y="828" width="120" height="48" rx="6" fill="#111721" stroke="#8b95a6" stroke-opacity=".25" stroke-width="2"/>
  </g>
  <ellipse cx="470" cy="900" rx="300" ry="40" fill="#5cc7ff" opacity=".06"/>
</svg>
