<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="桌面静物：相机、镜头、耳机">
  <title>桌面</title>
  <defs>
    <linearGradient id="deskBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101319"/>
      <stop offset=".55" stop-color="#1a1c22"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3128"/>
      <stop offset=".35" stop-color="#241f19"/>
      <stop offset="1" stop-color="#120f0c"/>
    </linearGradient>
    <radialGradient id="deskLight" cx=".38" cy=".16" r=".62">
      <stop offset="0" stop-color="#ffdca8" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#ffb057" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffb057" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6f7a"/>
      <stop offset=".45" stop-color="#2b2f37"/>
      <stop offset="1" stop-color="#14171c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#deskBg)"/>
  <rect width="1200" height="900" fill="url(#deskLight)"/>

  <!-- 桌沿 -->
  <rect x="0" y="520" width="1200" height="380" fill="url(#deskTop)"/>
  <rect x="0" y="516" width="1200" height="6" fill="#6b5a45" opacity=".45"/>

  <!-- 相机：机身 + 镜头 -->
  <g>
    <rect x="120" y="330" width="360" height="190" rx="16" fill="url(#metal)"/>
    <rect x="120" y="330" width="360" height="190" rx="16" fill="none" stroke="#8d949f" stroke-opacity=".4" stroke-width="2"/>
    <path d="M210 330 l26 -46 l110 0 l26 46 z" fill="#22262d"/>
    <rect x="268" y="272" width="44" height="18" rx="6" fill="#15181d"/>
    <path d="M480 360 l52 -18 l30 130 l-52 24 z" fill="#1c2028"/>
    <circle cx="330" cy="425" r="86" fill="#0f1217" stroke="#7d848f" stroke-opacity=".45" stroke-width="3"/>
    <circle cx="330" cy="425" r="66" fill="#080a0e" stroke="#5cc7ff" stroke-opacity=".3" stroke-width="2"/>
    <circle cx="306" cy="398" r="16" fill="#9fd2ff" opacity=".22"/>
    <circle cx="356" cy="450" r="8" fill="#ffb057" opacity=".3"/>
    <rect x="150" y="352" width="76" height="12" rx="6" fill="#3b414b"/>
  </g>

  <!-- 备用镜头：立着放 -->
  <g>
    <rect x="560" y="356" width="148" height="200" rx="18" fill="url(#metal)"/>
    <rect x="560" y="356" width="148" height="200" rx="18" fill="none" stroke="#8d949f" stroke-opacity=".35" stroke-width="2"/>
    <rect x="562" y="392" width="144" height="10" fill="#4a505b"/>
    <rect x="562" y="430" width="144" height="6" fill="#3a4049"/>
    <rect x="562" y="470" width="144" height="6" fill="#3a4049"/>
    <ellipse cx="634" cy="372" rx="74" ry="16" fill="#0d1015"/>
    <ellipse cx="634" cy="372" rx="52" ry="10" fill="#05070a"/>
    <rect x="612" y="300" width="44" height="58" rx="6" fill="#25292f"/>
  </g>

  <!-- 耳机 -->
  <g>
    <path d="M840 480 C840 372 916 300 1010 300 C1104 300 1180 372 1180 480" fill="none" stroke="#2f343c" stroke-width="18" stroke-linecap="round"/>
    <path d="M840 480 C840 372 916 300 1010 300" fill="none" stroke="#aeb6c2" stroke-opacity=".25" stroke-width="3"/>
    <rect x="812" y="466" width="66" height="118" rx="26" fill="#23272e"/>
    <rect x="1142" y="466" width="66" height="118" rx="26" fill="#23272e"/>
    <rect x="824" y="492" width="42" height="66" rx="18" fill="#0d1015"/>
    <rect x="1154" y="492" width="42" height="66" rx="18" fill="#0d1015"/>
    <rect x="820" y="474" width="10" height="100" rx="5" fill="#ffb057" opacity=".2"/>
  </g>

  <!-- 小物件：存储卡、电池 -->
  <g>
    <rect x="760" y="612" width="86" height="56" rx="6" fill="#1b1f26" stroke="#7d848f" stroke-opacity=".3"/>
    <rect x="774" y="628" width="30" height="24" rx="3" fill="#c9a44a" opacity=".5"/>
    <rect x="874" y="628" width="120" height="40" rx="6" fill="#191d23" stroke="#7d848f" stroke-opacity=".25"/>
    <rect x="886" y="640" width="16" height="16" rx="3" fill="#5bd07f" opacity=".35"/>
    <rect x="908" y="640" width="16" height="16" rx="3" fill="#5bd07f" opacity=".2"/>
  </g>

  <!-- 桌面反光 -->
  <g opacity=".18">
    <ellipse cx="330" cy="540" rx="150" ry="26" fill="#ffd7a0"/>
    <ellipse cx="634" cy="566" rx="80" ry="18" fill="#ffd7a0"/>
    <ellipse cx="1010" cy="600" rx="170" ry="24" fill="#ffd7a0"/>
  </g>
</svg>
