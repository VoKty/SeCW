<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="自组中塔主机示意图">
  <title>主力机 · 示意图</title>
  <defs>
    <linearGradient id="pcCase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b95a6" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2b3140" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="pcGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc7ff" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#9a86ff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="gpuFan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb057" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffb057" stop-opacity=".08"/>
    </linearGradient>
  </defs>

  <g stroke="#8b95a6" fill="none" stroke-width="2.5" stroke-linejoin="round">
    <!-- 机箱 -->
    <rect x="300" y="110" width="420" height="600" rx="18" fill="url(#pcCase)"/>
    <!-- 侧透玻璃 -->
    <rect x="322" y="140" width="330" height="540" rx="10" fill="url(#pcGlass)" stroke="#8b95a6" stroke-opacity=".35" stroke-width="2"/>
    <!-- 顶部与前部网孔 -->
    <rect x="310" y="122" width="400" height="12" rx="6" fill="#8b95a6" fill-opacity=".18"/>
    <rect x="736" y="140" width="14" height="540" rx="7" fill="#8b95a6" fill-opacity=".14" stroke="none"/>
  </g>

  <!-- 主板 + CPU 塔散热 -->
  <g stroke="#8b95a6" fill="none" stroke-width="2" stroke-opacity=".7">
    <rect x="346" y="180" width="240" height="300" rx="8" fill="#8b95a6" fill-opacity=".07"/>
    <rect x="392" y="212" width="132" height="120" rx="8" fill="#8b95a6" fill-opacity=".1"/>
    <g stroke-opacity=".35">
      <path d="M404 224 h108"/><path d="M404 244 h108"/><path d="M404 264 h108"/>
      <path d="M404 284 h108"/><path d="M404 304 h108"/><path d="M404 324 h108"/>
    </g>
    <!-- 内存条 -->
    <rect x="540" y="200" width="20" height="130" rx="4" fill="#5cc7ff" fill-opacity=".16"/>
    <rect x="566" y="200" width="20" height="130" rx="4" fill="#5cc7ff" fill-opacity=".12"/>
  </g>

  <!-- 显卡：整机里最显眼的一块 -->
  <g stroke="#8b95a6" fill="none" stroke-width="2.5">
    <rect x="346" y="500" width="286" height="66" rx="10" fill="#8b95a6" fill-opacity=".1"/>
    <circle cx="410" cy="533" r="24" fill="url(#gpuFan)" stroke="#8b95a6" stroke-opacity=".4"/>
    <circle cx="530" cy="533" r="24" fill="url(#gpuFan)" stroke="#8b95a6" stroke-opacity=".4"/>
    <rect x="346" y="486" width="286" height="8" rx="4" fill="#8b95a6" fill-opacity=".16" stroke="none"/>
  </g>

  <!-- 电源仓 -->
  <g stroke="#8b95a6" fill="none" stroke-width="2" stroke-opacity=".6">
    <rect x="360" y="606" width="230" height="60" rx="8" fill="#8b95a6" fill-opacity=".07"/>
    <circle cx="420" cy="636" r="20" fill="#8b95a6" fill-opacity=".1"/>
  </g>

  <!-- 右侧：参数柱状图，替代"跑分图" -->
  <g transform="translate(800 180)" font-family="ui-monospace, monospace">
    <g stroke="#8b95a6" stroke-opacity=".35" stroke-width="1.5">
      <path d="M0 0 v400"/><path d="M0 400 h330"/>
    </g>
    <g>
      <rect x="20" y="250" width="34" height="150" fill="#ffb057" fill-opacity=".35"/>
      <rect x="76" y="210" width="34" height="190" fill="#ffb057" fill-opacity=".3"/>
      <rect x="132" y="292" width="34" height="108" fill="#5cc7ff" fill-opacity=".32"/>
      <rect x="188" y="176" width="34" height="224" fill="#5cc7ff" fill-opacity=".28"/>
      <rect x="244" y="310" width="34" height="90" fill="#9a86ff" fill-opacity=".3"/>
    </g>
    <g fill="#8b95a6" font-size="15" opacity=".6">
      <text x="14" y="424">CPU</text><text x="70" y="424">RAM</text><text x="128" y="424">GPU</text>
      <text x="182" y="424">VRAM</text><text x="240" y="424">DISK</text>
    </g>
  </g>

  <text x="300" y="760" fill="#8b95a6" font-family="ui-monospace, monospace" font-size="19" letter-spacing="3" opacity=".45">RYZEN 5 5600 · 32GB DDR4 · RTX 5060</text>
</svg>
